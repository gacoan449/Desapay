name: desapay
description: Aplikasi PPOB DesaPay
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Utilitas
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  shared_preferences: ^2.3.5
  intl: ^0.20.3

  # Supabase Backend
  supabase_flutter: ^2.8.0

  # Authentication / Biometric
  local_auth: ^3.0.2

  # Scanner QRIS
  mobile_scanner: ^7.4.0
  image_picker: ^1.1.2

  # File & Excel
  file_picker: ^12.1.1
  excel: ^4.0.6

  # Caching Gambar Online
  cached_network_image: ^3.4.1

  # Browser & WhatsApp External Link
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
