name: desapay
description: Aplikasi PPOB DesaPay
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Utilitas Kriptografi & Data
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  shared_preferences: ^2.3.5
  intl: ^0.20.3

  # Firebase Backend Services (Versi Stabil Bebas Bug Kotlin)
  firebase_core: 3.6.0
  firebase_auth: 6.4.2
  cloud_firestore: 5.4.4
  firebase_storage: 13.1.2
  cloud_functions: 5.3.2
  local_auth: ^3.0.2

  # Scanner QRIS
  mobile_scanner: ^7.4.0
  image_picker: ^1.1.2

  # File & Excel
  file_picker: ^12.1.1
  excel: ^4.0.6

  # Keamanan API Keys
  flutter_dotenv: ^6.0.1

  # Caching Gambar Online
  cached_network_image: ^3.4.1

  # Browser & WhatsApp External Link
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo.png
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
