name: Deploy Firebase Backend

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Verify backend JavaScript
        working-directory: functions
        run: |
          node --check index.js
          node --check bootstrap.js
          node --check transactionFlow.js
          node --check notificationBridge.js
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Setup Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT tidak ditemukan."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const fs=require('fs');const p=process.env.RUNNER_TEMP+'/firebase-service-account.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(!d.project_id||!d.private_key||!d.client_email)throw new Error('Service Account JSON tidak lengkap');console.log('Service Account JSON valid.');"
      - name: Deploy Firebase backend (Functions and Firestore)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --only functions,firestore \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Storage rules deployment notice
        if: always()
        run: |
          echo "::warning::Storage rules were not deployed by this workflow because the configured service account lacks firebasestorage.defaultBucket.get (HTTP 403). Grant the required Firebase Storage permissions and deploy storage rules separately after verifying the default bucket exists."
