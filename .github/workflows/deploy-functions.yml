name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: sukqrxsolvukqunrurfw
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Supabase deployment token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Tambahkan SUPABASE_ACCESS_TOKEN di GitHub Actions Secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the CLI to avoid unauthenticated GitHub release API rate limits.
          version: 2.58.5

      # Payment callback remains a separate manual deployment until the real
      # TriPay Private Key has been saved as PAYMENT_WEBHOOK_SECRET in Supabase.
      - name: Deploy Supabase health and device-token functions
        run: |
          supabase functions deploy health --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy register-device --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy unregister-device --project-ref "$SUPABASE_PROJECT_REF"
