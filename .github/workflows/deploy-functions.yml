name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Firebase Service Account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT tidak ditemukan."
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

          echo "Memeriksa format Service Account JSON..."

          node -e "
          const fs = require('fs');
          const file = process.env.RUNNER_TEMP + '/firebase-service-account.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (!data.project_id) {
            throw new Error('project_id tidak ada di Service Account');
          }

          if (!data.private_key) {
            throw new Error('private_key tidak ada di Service Account');
          }

          if (!data.client_email) {
            throw new Error('client_email tidak ada di Service Account');
          }

          console.log('Service Account JSON valid.');
          console.log('Project ID:', data.project_id);
          "

      - name: Authenticate Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase projects:list \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Deploy Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase deploy \
            --only functions \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}"
