name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cek versi Flutter & Dart
        run: |
          flutter --version
          dart --version

      # Langkah 1: Buat folder android bersih otomatis
      - name: Generate Android Platform Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan, membuat platform Android..."
            flutter create . --platforms=android
          fi

      # Langkah 2: Ambil semua library/dependencies dari pubspec.yaml
      - name: Install Dependencies
        run: flutter pub get

      # Langkah 3: Generate launcher icons setelah folder android dipastikan siap
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # Langkah 4: Jalankan Pembersihan Sebelum Injeksi Gradle
      - name: Pre-Build Clean
        run: flutter clean

      # ✅ LANGKAH UTAMA: Paksa Naikkan Kotlin ke Versi 2.0.20 & Atasi Error CheckerFramework Firebase
      - name: Force Fix Firebase Kotlin Compiler Issue
        run: |
          SETTINGS_GRADLE="android/settings.gradle"
          BUILD_GRADLE="android/build.gradle"
          APP_BUILD_GRADLE="android/app/build.gradle"
          
          # 1. Paksa ganti versi Kotlin ke 2.0.20 di settings.gradle (Struktur Flutter Baru)
          if [ -f "$SETTINGS_GRADLE" ]; then
            echo "Mengubah versi Kotlin di settings.gradle..."
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.20"/' "$SETTINGS_GRADLE"
          fi
          
          # 2. Paksa ganti versi Kotlin ke 2.0.20 di build.gradle (Struktur Flutter Lama)
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Mengubah versi Kotlin di build.gradle..."
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.0.20'/g" "$BUILD_GRADLE"
            sed -i 's/ext.kotlin_version = "[^"]*"/ext.kotlin_version = "2.0.20"/g' "$BUILD_GRADLE"
          fi
          
          # 3. Suntikkan resolusi dependensi untuk memperbaiki kelas 'UnknownInitialization' yang hilang di Firebase Auth
          if [ -f "$APP_BUILD_GRADLE" ]; then
            echo "Menambahkan resolusi konfigurasi checker-qual ke app/build.gradle..."
            printf "\nandroid {\n    configurations.all {\n        resolutionStrategy {\n            forcedModules = ['org.checkerframework:checker-qual:3.42.0']\n        }\n    }\n}\n" >> "$APP_BUILD_GRADLE"
          fi

      # Langkah 5: Ambil ulang dependensi dan langsung kompilasi tanpa men-clean lagi
      - name: Build APK Final
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
