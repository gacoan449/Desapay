name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cek versi Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Pastikan Android Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android belum ada, membuat project Android..."
            flutter create . --platforms=android
          else
            echo "Folder android sudah ada, tidak membuat ulang."
          fi

      - name: Generate Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK & Patch compileSdk 36
        run: |
          flutter clean
          flutter pub get
          python3 -c "
          import os, re
          search_dirs = ['android', os.path.expanduser('~/.pub-cache')]
          for s_dir in search_dirs:
              for root, dirs, files in os.walk(s_dir):
                  for file in files:
                      if file.endswith('.gradle') or file.endswith('.gradle.kts'):
                          p = os.path.join(root, file)
                          try:
                              with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                                  content = f.read()
                              new_content = re.sub(r'(compileSdk\s*=\s*|compileSdkVersion\s+)[0-9]+', r'\1 36', content)
                              new_content = re.sub(r'(targetSdk\s*=\s*|targetSdkVersion\s+)[0-9]+', r'\1 36', new_content)
                              new_content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', new_content)
                              new_content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', new_content)
                              if new_content != content:
                                  with open(p, 'w', encoding='utf-8') as f:
                                      f.write(new_content)
                                  print(f'Patched: {p}')
                          except Exception as e:
                              print(f'Error patching {p}: {e}')
          "
          flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Bersihkan file build
        if: always()
        run: |
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          echo "File build sementara sudah dibersihkan."
