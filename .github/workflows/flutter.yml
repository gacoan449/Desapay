name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Pastikan proyek Flutter lengkap
      - name: Check Flutter source tree
        run: |
          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          test -f firebase.json
          echo "Flutter source tree valid."

      # Pastikan platform Android memang tersedia untuk build APK
      - name: Check Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Folder android tidak ditemukan."
            echo "Build APK membutuhkan folder android."
            exit 1
          fi

          echo "Android platform ditemukan."

      # Install dependency Flutter
      - name: Install Dependencies
        run: |
          flutter pub get

      # Generate launcher icon
      - name: Generate Launcher Icons
        run: |
          dart run flutter_launcher_icons

      # Bersihkan build sebelumnya
      - name: Pre-Build Clean
        run: |
          flutter clean
          flutter pub get

      # Cek Dart
      - name: Analyze Flutter Project
        run: |
          flutter analyze --no-fatal-infos

      # Build APK
      - name: Build APK Final
        run: |
          flutter build apk --release --no-tree-shake-icons

      # Cek hasil APK
      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/

          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      # Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
