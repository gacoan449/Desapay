name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cek versi Flutter & Dart
        run: |
          flutter --version
          dart --version

      # Langkah 1: Buat folder android bersih otomatis
      - name: Generate Android Platform Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan, membuat platform Android..."
            flutter create . --platforms=android
          fi

      # ✅ LANGKAH BARU: Paksa naikkan versi Kotlin agar Firebase v6 terbaru mau di-compile
      - name: Force Update Kotlin Version for Firebase
        run: |
          SETTINGS_GRADLE="android/settings.gradle"
          BUILD_GRADLE="android/build.gradle"
          
          # Cek jika proyek menggunakan struktur settings.gradle baru (Flutter 3.x ke atas)
          if [ -f "$SETTINGS_GRADLE" ]; then
            echo "Mengubah versi Kotlin di settings.gradle..."
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' "$SETTINGS_GRADLE"
          fi
          
          # Cek jika proyek menggunakan struktur build.gradle lama
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Mengubah versi Kotlin di build.gradle..."
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" "$BUILD_GRADLE"
            sed -i 's/ext.kotlin_version = "[^"]*"/ext.kotlin_version = "1.9.24"/g' "$BUILD_GRADLE"
          fi

      # Langkah 2: Ambil semua library/dependencies dari pubspec.yaml
      - name: Install Dependencies
        run: flutter pub get

      # Langkah 3: Generate launcher icons setelah folder android dipastikan siap
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      # Langkah 4: Jalankan proses kompilasi rilis APK dengan bersih
      - name: Build APK Clean
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
