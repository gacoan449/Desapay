name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter source tree
        run: |
          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          test -d functions
          test -f functions/index.js
          test -f functions/package.json
          test -f firebase.json
          echo "Source tree valid."

      - name: Install Flutter dependencies
        run: |
          flutter pub get

      - name: Generate Launcher Icons
        run: |
          dart run flutter_launcher_icons || echo "Launcher icons dilewati"

      - name: Clean Flutter
        run: |
          flutter clean
          flutter pub get

      - name: Prepare Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan."
            flutter create . --platforms=android
          fi

      - name: Verify Firebase Functions
        working-directory: functions
        run: |
          npm install
          node --check index.js

      - name: Build APK Release
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Check APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
