name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cek versi Flutter
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Pastikan Android SDK 36 tersedia
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Cek struktur Android
        run: |
          echo "=== android/app/build.gradle ==="
          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          fi

          echo "=== android/app/build.gradle.kts ==="
          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          fi

          echo "=== android/build.gradle ==="
          if [ -f android/build.gradle ]; then
            cat android/build.gradle
          fi

      - name: Paksa compileSdk aplikasi ke 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          found = False

          for path in candidates:
              if not path.exists():
                  continue

              found = True
              text = path.read_text(encoding="utf-8")
              original = text

              # Groovy
              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )

              text = text.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36"
              )

              text = text.replace(
                  "compileSdkVersion 34",
                  "compileSdkVersion 36"
              )

              text = text.replace(
                  "compileSdkVersion 35",
                  "compileSdkVersion 36"
              )

              # Kotlin DSL
              text = text.replace(
                  "compileSdk = 34",
                  "compileSdk = 36"
              )

              text = text.replace(
                  "compileSdk = 35",
                  "compileSdk = 36"
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print(f"Updated: {path}")
              else:
                  print(f"No change needed: {path}")

          if not found:
              raise SystemExit(
                  "android/app/build.gradle atau build.gradle.kts tidak ditemukan."
              )
          PY

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Generate Launcher Icons
        run: |
          dart run flutter_launcher_icons

      - name: Verifikasi compileSdk
        run: |
          echo "=== Semua referensi compileSdk di project Android ==="
          grep -Rni "compileSdk" android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Cek ukuran APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/

          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Bersihkan file build
        if: always()
        run: |
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
