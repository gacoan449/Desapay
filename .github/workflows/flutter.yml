name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 4. CEK STRUKTUR SOURCE
      # ============================================================
      - name: Check Flutter source tree
        run: |
          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          test -d functions
          test -f functions/index.js
          test -f functions/package.json
          test -f firebase.json
          echo "Source tree valid."

      # ============================================================
      # 5. INSTALL FLUTTER DEPENDENCIES
      # ============================================================
      - name: Install Flutter dependencies
        run: |
          flutter pub get

      # ============================================================
      # 6. BUAT ANDROID PLATFORM SEMENTARA
      # ============================================================
      - name: Generate Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ada."
            echo "Membuat Android platform untuk proses build APK..."
            flutter create . --platforms=android
          else
            echo "Folder android sudah tersedia."
          fi

      # ============================================================
      # 7. GENERATE LAUNCHER ICON
      # ============================================================
      - name: Generate Launcher Icons
        run: |
          dart run flutter_launcher_icons || echo "Launcher icons dilewati"

      # ============================================================
      # 8. CLEAN
      # ============================================================
      - name: Clean Flutter
        run: |
          flutter clean
          flutter pub get

      # ============================================================
      # 9. FIREBASE FUNCTIONS
      #    HANYA VERIFIKASI KODE BACKEND
      # ============================================================
      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: |
          npm install

      - name: Verify Firebase Functions
        working-directory: functions
        run: |
          node --check index.js

      # ============================================================
      # 10. BUILD APK
      #    GITHUB SECRETS -> DART DEFINE -> FIREBASE
      # ============================================================
      - name: Build APK Release
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID_ANDROID="${{ secrets.FIREBASE_APP_ID_ANDROID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ secrets.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.STORAGE_BUCKET }}"

      # ============================================================
      # 11. CHECK APK
      # ============================================================
      - name: Check APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/

          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      # ============================================================
      # 12. UPLOAD APK
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
