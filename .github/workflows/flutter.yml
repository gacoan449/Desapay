name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Langkah 1: Buat folder android dari nol jika tidak sengaja terhapus/tidak ada
      - name: Generate Android Platform Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan, membuat platform Android..."
            flutter create . --platforms=android
          fi

      # Langkah 2: Ambil seluruh dependensi aplikasi secara bersih
      - name: Install Dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      # Langkah 3: Generate launcher icons (otomatis dilewati jika aset belum siap)
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons || echo "Launcher icons dilewati"

      # Langkah 4: Bersihkan sisa build peladen lama
      - name: Pre-Build Clean
        run: flutter clean

      # Langkah 5: Suntik taktik intervensi compiler Kotlin di tingkat Gradle Proyek
      - name: Inject Global Gradle Resolution Strategy
        run: |
          flutter pub get
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Menyuntikkan aturan pengikat untuk menepis error checker-qual..."
            cat << 'EOF' >> "$BUILD_GRADLE"

            allprojects {
                configurations.all {
                    resolutionStrategy {
                        forcedModules = ['org.checkerframework:checker-qual:3.42.0']
                    }
                }
                tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                    kotlinOptions {
                        freeCompilerArgs += ["-Xskip-metadata-version-check"]
                    }
                }
            }
          EOF
          fi

      # Langkah 6: Proses Kompilasi Akhir Menjadi APK Rilis
      - name: Build APK Final
        run: flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
