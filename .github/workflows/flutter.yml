name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Langkah 1: Buat folder android dari nol jika tidak ada
      - name: Generate Android Platform Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan, membuat platform Android..."
            flutter create . --platforms=android
          fi

      # Langkah 2: Ambil seluruh dependensi awal aplikasi
      - name: Install Dependencies
        run: flutter pub get

      # Langkah 3: Generate launcher icons (di-skip dengan aman jika belum ada asetnya)
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons || echo "Launcher icons dilewati"

      # Langkah 4: Bersihkan sisa build lama
      - name: Pre-Build Clean
        run: flutter clean

      # ✅ LANGKAH UTAMA (FIX): Paksa Resolusi checker-qual versi lebih tinggi di root build.gradle
      - name: Force Fix Firebase Kotlin Checker Qual via Root Build.gradle
        run: |
          # 1. Ambil ulang pub dependencies pasca clean
          flutter pub get
          
          BUILD_GRADLE="android/build.gradle"
          
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Menyuntikkan strategi resolusi checker-qual versi mutakhir ke root build.gradle..."
            cat << 'EOF' >> "$BUILD_GRADLE"

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      // Memaksa versi checker-qual yang kompatibel dengan anotasi Kotlin compiler modern
                      forcedModules = ['org.checkerframework:checker-qual:3.48.3']
                  }
              }
          }
          EOF
          fi

      # Langkah 5: Proses Kompilasi Akhir Menjadi APK Rilis
      - name: Build APK Final
        run: flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
