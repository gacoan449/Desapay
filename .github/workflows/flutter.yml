name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Langkah 1: Buat folder android bersih otomatis dari nol
      - name: Generate Android Platform Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan, membuat platform Android..."
            flutter create . --platforms=android
          fi

      # Langkah 2: Ambil semua library/dependencies awal dari pubspec.yaml
      - name: Install Dependencies
        run: flutter pub get

      # Langkah 3: Generate launcher icons setelah folder android dipastikan siap
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons || echo "Launcher icons skip jika tidak dikonfigurasi"

      # Langkah 4: Jalankan Pembersihan Sebelum Injeksi Gradle Modern
      - name: Pre-Build Clean
        run: flutter clean

      # ✅ LANGKAH UTAMA: Suntik Skrip Perbaikan Global ke settings.gradle & build.gradle
      - name: Force Fix Flutter Gradle Plugins & Firebase Compiler Issue
        run: |
          SETTINGS_GRADLE="android/settings.gradle"
          BUILD_GRADLE="android/build.gradle"
          
          # 1. Ubah settings.gradle agar meng-apply Kotlin 2.0.20 secara global
          if [ -f "$SETTINGS_GRADLE" ]; then
            echo "Mengonfigurasi settings.gradle..."
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.20"/' "$SETTINGS_GRADLE"
          fi
          
          # 2. SOLUSI FIX 'Extension with name flutter does not exist':
          # Kita memaksa root build.gradle untuk meng-apply plugin Flutter secara eksplisit ke tingkat root 
          # agar terekspos ke subprojects modern berbasis Kotlin DSL (.kts) seperti android_file_picker.
          echo "Menyuntikkan perbaikan plugin global ke root build.gradle..."
          
          # Bersihkan total build.gradle bawaan dan ganti dengan struktur kokoh yang kompatibel dengan subprojects .kts
          cat << 'EOF' > "$BUILD_GRADLE"
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          // Atasi kegagalan pembacaan ekstensi flutter pada plugin .kts eksternal
          subprojects {
              project.afterEvaluate {
                  if (project.plugins.hasPlugin("com.android.library") || project.plugins.hasPlugin("com.android.application")) {
                      project.configurations.all {
                          resolutionStrategy {
                              // Paksa perbaikan konflik Firebase Auth Kotlin Compiler
                              forcedModules = ['org.checkerframework:checker-qual:3.43.0']
                          }
                      }
                  }
              }
          }
          EOF

      # Langkah 5: Ambil ulang dependensi dan langsung kompilasi rilis tanpa men-clean lagi
      - name: Build APK Final
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
