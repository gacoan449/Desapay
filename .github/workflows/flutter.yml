name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cek versi Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Pastikan Android Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android belum ada, membuat project Android..."
            flutter create . --platforms=android
          else
            echo "Folder android sudah ada, tidak membuat ulang."
          fi

      - name: Force App compileSdk & targetSdk to 36
        run: |
          FILE="android/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i -E 's/(compileSdk|compileSdkVersion)( =| )([a-zA-Z0-9._]+)/\1\236/g' $FILE
            sed -i -E 's/(targetSdk|targetSdkVersion)( =| )([a-zA-Z0-9._]+)/\1\236/g' $FILE
            echo "Berhasil memperbarui versi SDK aplikasi di $FILE"
          else
            echo "File $FILE tidak ditemukan!"
          fi

      - name: Force All Plugins (Subprojects) to compileSdk 36
        run: |
          BUILD_FILE="android/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            cat <<'EOF' >> android/build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 36
            }
        }
    }
}
EOF
            echo "Berhasil memaksa seluruh plugin menggunakan compileSdkVersion 36"
          else
            echo "File $BUILD_FILE tidak ditemukan!"
          fi

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Generate Launcher Icons
        run: |
          dart run flutter_launcher_icons

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Bersihkan file build
        if: always()
        run: |
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          echo "File build sementara sudah dibersihkan."
