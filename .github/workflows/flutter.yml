name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Langkah 1: Buat folder android dari nol jika tidak ada
      - name: Generate Android Platform Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan, membuat platform Android..."
            flutter create . --platforms=android
          fi

      # Langkah 2: Ambil seluruh dependensi awal aplikasi
      - name: Install Dependencies
        run: flutter pub get

      # Langkah 3: Generate launcher icons (di-skip dengan aman jika belum ada asetnya)
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons || echo "Launcher icons dilewati"

      # Langkah 4: Bersihkan sisa build lama
      - name: Pre-Build Clean
        run: flutter clean

      # ✅ LANGKAH UTAMA (FIX): Sinkronisasi Plugin & Resolusi Firebase via settings.gradle
      - name: Configure Gradle Settings & Fix Extensions
        run: |
          # 1. Ambil ulang pub dependencies pasca clean
          flutter pub get
          
          # 2. Amankan settings.gradle
          SETTINGS_GRADLE="android/settings.gradle"
          
          if [ -f "$SETTINGS_GRADLE" ]; then
            echo "Menyuntikkan perbaikan ekstensi flutter dan resolusi compiler Firebase..."
            
            # Tambahkan konfigurasi resolusi strategi langsung ke tingkat manajemen proyek di settings.gradle
            # Ini akan memaksa semua modul (termasuk .kts seperti android_file_picker) memuat classpath dengan benar
            cat << 'EOF' >> "$SETTINGS_GRADLE"

            // Perbaikan otomatis untuk dependensi Firebase & modul .kts eksternal
            gradle.lifecycle.beforeProject { project ->
                project.configurations.all {
                    resolutionStrategy {
                        forcedModules = ['org.checkerframework:checker-qual:3.43.0']
                    }
                }
            }
          EOF
          fi

      # Langkah 5: Proses Kompilasi Akhir Menjadi APK Rilis
      - name: Build APK Final
        run: flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
