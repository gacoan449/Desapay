name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Langkah 1: Buat folder android dari nol jika tidak ada
      - name: Generate Android Platform Folder
        run: |
          if [ ! -d "android" ]; then
            echo "Folder android tidak ditemukan, membuat platform Android..."
            flutter create . --platforms=android
          fi

      # Langkah 2: Intervensi pubspec.yaml untuk mengatasi konflik Firebase secara instan
      - name: Align Firebase Package Versions
        run: |
          echo "Menyesuaikan versi Firebase di pubspec.yaml agar ramah compiler..."
          # Mengganti versi Firebase ke versi stabil yang tidak merusak classpath checker-qual
          sed -i 's/firebase_core: ^4.14.0/firebase_core: ^3.6.0/g' pubspec.yaml
          sed -i 's/firebase_auth: ^6.6.0/firebase_auth: ^5.3.1/g' pubspec.yaml
          sed -i 's/cloud_firestore: ^6.9.0/cloud_firestore: ^5.4.4/g' pubspec.yaml
          sed -i 's/firebase_storage: ^13.5.0/firebase_storage: ^12.3.2/g' pubspec.yaml

      # Langkah 3: Ambil seluruh dependensi aplikasi yang sudah diselaraskan
      - name: Install Dependencies
        run: flutter pub get

      # Langkah 4: Generate launcher icons (otomatis dilewati jika aset belum siap)
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons || echo "Launcher icons dilewati"

      # Langkah 5: Bersihkan sisa build lama
      - name: Pre-Build Clean
        run: flutter clean

      # ✅ LANGKAH EMAS: Kunci paksa resolusi compiler Kotlin agar tidak crash di modul eksternal
      - name: Force Global Gradle Resolution Strategy
        run: |
          # Ambil kembali dependensi pasca clean
          flutter pub get
          
          BUILD_GRADLE="android/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            echo "Menyuntikkan aturan pengikat untuk menepis error checker-qual..."
            cat << 'EOF' >> "$BUILD_GRADLE"

            allprojects {
                configurations.all {
                    resolutionStrategy {
                        // Memaksa Gradle menggunakan versi checker-qual stabil di tingkat root kompilasi
                        forcedModules = ['org.checkerframework:checker-qual:3.42.0']
                    }
                }
            }
          EOF
          fi

      # Langkah 6: Proses Kompilasi Akhir Menjadi APK Rilis
      - name: Build APK Final
        run: flutter build apk --release --no-tree-shake-icons

      - name: Cek hasil APK
        run: |
          echo "=== HASIL BUILD ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== UKURAN APK ==="
          du -h build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
