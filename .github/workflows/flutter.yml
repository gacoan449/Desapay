name: Flutter Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # Otomatis membuat folder android yang hilang sebelum build
    - name: Auto Generate Android Folder
      run: flutter create . --platforms=android

    - name: Install dependencies
      run: flutter pub get

    # 🔴 BARIS BARU: Menjalankan generator untuk menimpa logo bawaan Flutter dengan logo DesaPay Anda
    - name: Generate Launcher Icons
      run: flutter pub run flutter_launcher_icons

    # Mengubah build ke --release agar aplikasi lebih ringan dan siap pakai
    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: flutter-app-release
        path: build/app/outputs/flutter-apk/app-release.apk
