name: Flutter Build APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Flutter source tree
        run: |
          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          test -d functions
          test -f functions/index.js
          test -f functions/bootstrap.js
          test -f functions/transactionFlow.js
          test -f functions/notificationBridge.js
          test -f functions/package.json
          test -f firebase.json
          test -f firestore.rules
          test -f firestore.indexes.json
          test -f storage.rules
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate Android Platform
        run: |
          if [ ! -d "android" ]; then flutter create . --platforms=android; fi
      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons || echo "Launcher icons dilewati"
      - name: Clean Flutter
        run: |
          flutter clean
          flutter pub get
      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install
      - name: Verify Firebase Functions JavaScript
        working-directory: functions
        run: |
          node --check index.js
          node --check bootstrap.js
          node --check transactionFlow.js
          node --check notificationBridge.js
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK Release
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID_ANDROID="${{ secrets.FIREBASE_APP_ID_ANDROID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ secrets.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.STORAGE_BUCKET }}"
      - name: Check APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          du -h build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
